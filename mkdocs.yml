site_name: Applied Risk Management Lab
site_description: Eight-module applied financial risk course
site_author: Zachary Smith
repo_name: Applied Risk Management Lab
theme:
  name: material
  logo: assets/risk-mark.svg
  favicon: assets/risk-mark.svg
  features: [navigation.instant, navigation.instant.progress, navigation.sections, navigation.indexes, navigation.top, navigation.footer, search.suggest, search.highlight, content.code.copy, toc.follow]
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  font: {text: Inter, code: JetBrains Mono}
plugins:
  - search
markdown_extensions: [admonition, attr_list, md_in_html, tables, footnotes, pymdownx.details, pymdownx.superfences]
extra_css: [styles.css]
copyright: Applied Risk Management Lab · Zachary Smith
nav:
  - Home: index.md
  - Start Here:
      - Course Map: course-map.md
      - Learning Model: learning-model.md
      - Assessment: assessment.md
  - Module 1 · Risk, Uncertainty, and Judgment: modules/module-1.md
  - Module 2 · Market Risk and Tail Loss: modules/module-2.md
  - Module 3 · Model Risk and Leverage: modules/module-3.md
  - Module 4 · Liquidity and Funding: modules/module-4.md
  - Module 5 · Credit and Counterparty Risk: modules/module-5.md
  - Module 6 · Systemic Risk and Contagion: modules/module-6.md
  - Module 7 · Governance and Regulation: modules/module-7.md
  - Module 8 · Enterprise Risk and the CRO Challenge: modules/module-8.md
  - Case Library:
      - Knight Capital: cases/knight.md
      - London Whale: cases/whale.md
      - LTCM: cases/ltcm.md
      - Lehman Brothers: cases/lehman.md
      - Credit Portfolio: cases/credit.md
      - Global Financial Crisis: cases/gfc.md
      - Atlas Bank International: cases/atlas.md
      - Sunrise National Bank: cases/cro.md
  - Quantitative Labs:
      - Module 1 Lab: labs/module-1.md
      - Module 2 Lab: labs/module-2.md
      - Module 3 Lab: labs/module-3.md
      - Module 4 Lab: labs/module-4.md
      - Module 5 Lab: labs/module-5.md
      - Module 6 Lab: labs/module-6.md
      - Module 7 Lab: labs/module-7.md
      - Module 8 Lab: labs/module-8.md
  - Instructor Guide: instructor-guide.md

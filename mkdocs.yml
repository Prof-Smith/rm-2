site_name: Applied Risk Management Lab
site_description: Decision-first financial risk course
site_author: Zachary Smith
theme:
  name: material
  logo: assets/risk-mark.svg
  favicon: assets/risk-mark.svg
  features: [navigation.instant, navigation.instant.progress, navigation.sections, navigation.indexes, navigation.top, navigation.footer, search.suggest, search.highlight, content.code.copy, toc.follow]
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  font: {text: Inter, code: JetBrains Mono}
plugins: [search]
markdown_extensions: [admonition, attr_list, md_in_html, tables, footnotes, pymdownx.details, pymdownx.superfences]
extra_css: [styles.css]
copyright: Applied Risk Management Lab · Zachary Smith
nav:
